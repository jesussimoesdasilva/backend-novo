<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificação de Membro Oficial</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#020617;color:#f1f5f9;min-height:100vh;display:grid;place-items:center;padding:20px}
  .card{background:#0f172a;border:1px solid #334155;border-radius:20px;max-width:400px;width:100%;padding:30px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6)}
  .badge{display:inline-block;padding:6px 16px;border-radius:99px;font-weight:800;font-size:13px;margin-bottom:20px}
  .ativo{background:rgba(16,185,129,.15);color:#10b981;border:1px solid #10b981}
  .inativo{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid #ef4444}
  .foto{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid #facc15;margin:0 auto 15px;background:#1e293b;display:grid;place-items:center;font-size:40px}
  h2{color:#facc15;font-size:20px;margin-bottom:4px}
  .igreja{color:#94a3b8;font-size:13px;margin-bottom:20px}
  .info{background:#020617;border-radius:12px;padding:15px;text-align:left;font-size:13px;border:1px solid #1e293b}
  .info p{margin-bottom:8px;color:#cbd5e1}
  .info strong{color:#facc15}
</style>
</head>
<body>
<div class="card" id="box">
  <p style="color:#94a3b8">A verificar credencial...</p>
</div>
<script>
async function validar() {
  const id = window.location.pathname.split('/').pop();
  const box = document.getElementById('box');
  try {
    const r = await fetch('/api/membros/publico/' + id);
    if (!r.ok) throw new Error('Credencial não encontrada');
    const m = await r.json();
    const isAtivo = m.status === 'ATIVO';
    box.innerHTML = `
      <div class="badge ${isAtivo ? 'ativo' : 'inativo'}">${isAtivo ? '✅ MEMBRO ATIVO VERIFICADO' : '⚠️ CADASTRO ' + m.status}</div>
      ${m.foto ? `<img src="${m.foto}" class="foto">` : `<div class="foto">👤</div>`}
      <h2>${m.nome}</h2>
      <div class="igreja">${m.igreja?.nome || 'Igreja Oficial'}</div>
      <div class="info">
        <p><strong>Nº de Registo:</strong> #${String(m.id).padStart(5, '0')}</p>
        <p><strong>Cargo:</strong> ${m.cargo || 'Membro'}</p>
        <p><strong>Departamento:</strong> ${m.departamento?.nome || 'Geral'}</p>
        <p style="margin:0"><strong>Membro desde:</strong> ${new Date(m.criadoEm).toLocaleDateString('pt-PT')}</p>
      </div>
    `;
  } catch (e) {
    box.innerHTML = `<div class="badge inativo">❌ CREDENCIAL INVÁLIDA</div><p style="color:#94a3b8;font-size:14px">Este cartão não corresponde a nenhum membro registado.</p>`;
  }
}
validar();
</script>
</body>
</html>

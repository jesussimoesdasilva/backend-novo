<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Igrejas - Angola</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body { 
            background: radial-gradient(circle at 15% 50%, rgba(30, 64, 175, 0.15), transparent 40%),
                        radial-gradient(circle at 85% 30%, rgba(212, 160, 23, 0.1), transparent 40%),
                        #020617; 
            color: #f1f5f9; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            position: relative;
        }

        /* Efeito de luz animado no fundo */
        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(250, 204, 21, 0.08) 0%, transparent 60%);
            border-radius: 50%;
            animation: pulse 8s infinite alternate;
            z-index: -1;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); opacity: 0.5; }
            100% { transform: scale(1.2) translate(50px, -50px); opacity: 1; }
        }

        /* O Cartão de Vidro (Glassmorphism) */
        .container { 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 50px 40px; 
            border-radius: 24px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(250, 204, 21, 0.1);
            max-width: 480px; 
            width: 90%; 
            text-align: center;
            animation: fadeUp 0.8s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Ícone central animado */
        .icon-wrapper {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, rgba(250, 204, 21, 0.2), rgba(234, 179, 8, 0.05));
            border: 1px solid rgba(250, 204, 21, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.15);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 { 
            font-size: 34px; 
            font-weight: 900; 
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fde68a, #facc15, #eab308);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px; 
        }

        p.subtitle { 
            color: #94a3b8; 
            font-size: 15px; 
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 35px; 
            letter-spacing: 0.5px;
        }

        /* Botão Premium */
        .btn { 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #facc15, #d4a017); 
            color: #020617; 
            text-decoration: none; 
            padding: 18px; 
            border-radius: 14px; 
            font-weight: 800; 
            font-size: 16px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            border: none;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 10px 20px -10px rgba(250, 204, 21, 0.5);
        }

        .btn:hover { 
            transform: translateY(-3px) scale(1.02); 
            box-shadow: 0 15px 25px -10px rgba(250, 204, 21, 0.7);
            background: linear-gradient(135deg, #fde68a, #facc15);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #cbd5e1;
            box-shadow: none;
            margin-top: 15px;
            font-weight: 400;
            font-size: 14px;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            box-shadow: none;
            transform: none;
        }

        .footer { 
            margin-top: 40px; 
            font-size: 12px; 
            color: #475569; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="glow"></div>

    <div class="container">
        <div class="icon-wrapper">⛪</div>
        
        <h1>Sistema Multi-Igreja</h1>
        <p class="subtitle">Plataforma oficial de gestão, comunicação e administração eclesiástica em Angola.</p>
        
        <a href="/admin.html" class="btn">
            <span>🔐</span> Aceder ao Painel Master
        </a>
        
        <a href="/site-igreja.html" class="btn btn-outline">
            Ver Site de Exemplo
        </a>
        
        <div class="footer">© 2026 · Todos os direitos reservados</div>
    </div>
</body>
</html>

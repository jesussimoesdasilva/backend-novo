<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do Secretário</title>
<style>
:root{--navy:#020617;--navy2:#0f172a;--navy3:#1e293b;--gold:#facc15;--gold2:#eab308;--cyan:#22d3ee;--green:#10b981;--red:#ef4444;--text:#f1f5f9;--muted:#94a3b8;--border:#334155}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--navy);color:var(--text)}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,rgba(59,130,246,.15),transparent 50%),var(--navy)}
.login-card{background:rgba(30,41,59,.9);border:1px solid var(--border);border-radius:20px;padding:40px;max-width:420px;width:100%}
.login-logo{width:70px;height:70px;margin:0 auto 20px;border-radius:16px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;font-size:32px;overflow:hidden}
.login-card h2{text-align:center;color:var(--gold);font-size:24px;margin-bottom:8px}
.login-card p{text-align:center;color:var(--muted);font-size:14px;margin-bottom:30px}
.login-field{margin-bottom:16px}
.login-field label{display:block;color:var(--text);font-size:13px;font-weight:600;margin-bottom:6px}
.login-field input{width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:10px;background:rgba(2,6,23,.6);color:var(--text);font-size:14px}
.btn-login{width:100%;padding:14px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}
.painel{display:none;min-height:100vh}
.painel.show{display:flex}
.sidebar{width:260px;background:rgba(15,23,42,.8);border-right:1px solid var(--border);padding:25px 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 25px 20px;border-bottom:1px solid var(--border);margin-bottom:15px}
.brand-icon{width:48px;height:48px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:12px;display:grid;place-items:center;font-size:24px;margin-bottom:12px}
.brand h1{color:var(--gold);font-size:16px;font-weight:800}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:500;margin-bottom:3px;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(250,204,21,.15),transparent);color:var(--gold);border-left:3px solid var(--gold)}
.main{flex:1;padding:30px 40px;min-width:0}
.card{background:rgba(30,41,59,.6);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px}
.card h3{color:var(--gold);font-size:18px;margin-bottom:16px}
.btn{padding:11px 20px;border-radius:10px;font-weight:700;font-size:14px;border:none;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy)}
.btn-danger{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);padding:7px 12px;font-size:12px;border-radius:8px}
.btn-outline{background:transparent;border:1px solid var(--gold);color:var(--gold);padding:7px 12px;font-size:12px;border-radius:8px}
.section{display:none}
.section.active{display:block}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--gold);font-size:12px;text-transform:uppercase}
.toast-container{position:fixed;top:20px;right:20px;z-index:999}
.toast{background:var(--navy3);border-left:4px solid var(--green);padding:14px 18px;border-radius:8px;margin-bottom:10px;font-size:14px}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo" id="loginLogo">⛪</div>
    <h2 id="loginNome">A carregar...</h2>
    <p>Painel do Secretário</p>
    <form onsubmit="fazerLogin(event)">
      <div class="login-field"><label>Email</label><input type="email" id="loginEmail" required></div>
      <div class="login-field"><label>Senha</label><input type="password" id="loginSenha" required></div>
      <button type="submit" class="btn-login">🔐 Entrar</button>
      <div id="loginError" style="color:red; margin-top:10px; font-size:13px; display:none;"></div>
    </form>
  </div>
</div>

<div class="painel" id="painel">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon" id="brandIcon">⛪</div>
      <h1 id="brandNome">Igreja</h1>
      <p>Painel do Secretário</p>
    </div>
    <button class="nav-item active" onclick="section('membros',this)"><span>👥</span> Membros</button>
    <button class="nav-item" onclick="section('documentos',this)"><span>📑</span> Documentos e Atas</button>
    <button class="nav-item" onclick="section('presencas',this)"><span>✅</span> Presenças e Escalas</button>
    <div style="margin-top:auto;padding:15px 25px;border-top:1px solid var(--border);">
      <button class="btn btn-danger" style="width:100%" onclick="logout()">🚪 Sair</button>
    </div>
  </aside>
  
  <main class="main">
    <!-- SECÇÃO MEMBROS -->
    <div id="section-membros" class="section active">
      <div class="card">
        <h3>👥 Gestão de Membros</h3>
        <div id="listaMembros" style="color:var(--muted)">A carregar...</div>
      </div>
    </div>

    <!-- SECÇÃO DOCUMENTOS -->
    <div id="section-documentos" class="section">
      <div class="card">
        <h3>📑 Documentos e Atas</h3>
        <button class="btn btn-primary" onclick="abrirModalDocumento()">➕ Adicionar Documento</button>
        <div id="listaDocumentos" style="margin-top:20px;color:var(--muted)">A carregar...</div>
      </div>
    </div>

    <!-- SECÇÃO PRESENÇAS -->
    <div id="section-presencas" class="section">
      <div class="card">
        <h3>✅ Presenças</h3>
        <button class="btn btn-primary" onclick="abrirModalPresenca()">➕ Registar Presença</button>
        <div id="listaPresencas" style="margin-top:20px;color:var(--muted)">A carregar...</div>
      </div>
    </div>
  </main>
</div>

<div class="toast-container" id="toasts"></div>

<script>
const API = '/api';
const pathParts = window.location.pathname.split('/');
const slug = pathParts[pathParts.length - 2];
let igrejaAtual = null;

function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

// ===== LOGIN E NAVEGAÇÃO =====
async function initLogin() {
  try {
    const r = await fetch(API + '/igrejas');
    const lista = await r.json();
    const ig = lista.find(i => i.slug === slug);
    if (!ig) return document.getElementById('loginNome').textContent = 'Igreja não encontrada';
    
    document.getElementById('loginNome').textContent = ig.nome;
    document.getElementById('brandNome').textContent = ig.nome;
    
    const saved = localStorage.getItem('secretario_' + slug);
    if (saved) {
      igrejaAtual = JSON.parse(saved);
      mostrarPainel();
    }
  } catch (e) { console.error(e); }
}

async function fazerLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  const err = document.getElementById('loginError');
  err.style.display = 'none';
  
  try {
    const r = await fetch(API + '/membros/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, senha })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || 'Erro no login');
    
    // Verifica se o membro é secretário (role = 'secretario' ou cargo = 'Secretário')
    if (d.membro.role !== 'secretario' && d.membro.cargo !== 'Secretário') {
      throw new Error('Acesso restrito. Apenas secretários podem entrar aqui.');
    }
    
    igrejaAtual = d.membro;
    localStorage.setItem('secretario_' + slug, JSON.stringify(d.membro));
    mostrarPainel();
  } catch (e) {
    err.textContent = '❌ ' + e.message;
    err.style.display = 'block';
  }
}

function mostrarPainel() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('painel').classList.add('show');
  carregarMembros();
}

function logout() {
  localStorage.removeItem('secretario_' + slug);
  igrejaAtual = null;
  document.getElementById('painel').classList.remove('show');
  document.getElementById('loginScreen').style.display = 'grid';
}

function section(name, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById('section-' + name).classList.add('active');
  btn.classList.add('active');
  
  if (name === 'membros') carregarMembros();
  if (name === 'documentos') carregarDocumentos();
  if (name === 'presencas') carregarPresencas();
}

// ===== CARREGAR MEMBROS =====
async function carregarMembros() {
  const div = document.getElementById('listaMembros');
  div.innerHTML = 'A carregar...';
  
  try {
    const r = await fetch(API + '/membros/igreja/' + igrejaAtual.igrejaId);
    const membros = await r.json();
    
    if (!membros.length) {
      div.innerHTML = '<p style="color:var(--muted)">Nenhum membro registado.</p>';
      return;
    }
    
    div.innerHTML = `
      <table>
        <thead><tr>
          <th>Nome</th><th>Email</th><th>Departamento</th><th>Data Batismo</th><th>Ações</th>
        </tr></thead>
        <tbody>
          ${membros.map(m => `
            <tr>
              <td>${m.nome}</td>
              <td>${m.email}</td>
              <td>${m.departamento ? m.departamento.nome : '-'}</td>
              <td>${m.dataBatismo ? new Date(m.dataBatismo).toLocaleDateString('pt-PT') : '-'}</td>
              <td>
                <button class="btn btn-outline" onclick="editarMembro(${m.id}, '${m.nome.replace(/'/g, "\\'")}', ${m.departamentoId || 'null'}, '${m.dataBatismo || ''}')">✏️ Editar</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (e) {
    div.innerHTML = '<p style="color:var(--red)">Erro ao carregar membros.</p>';
  }
}

// ===== EDITAR MEMBRO (SECRETÁRIO) =====
async function editarMembro(id, nome, departamentoId, dataBatismo) {
  const novoDepartamento = prompt(`Departamento para ${nome} (deixe em branco para manter):`);
  const novaData = prompt(`Data de Batismo (AAAA-MM-DD) para ${nome} (deixe em branco para manter):`);
  
  const dados = {};
  if (novoDepartamento) dados.departamentoId = novoDepartamento;
  if (novaData) dados.dataBatismo = novaData;
  
  if (Object.keys(dados).length === 0) return;
  
  try {
    const r = await fetch(API + '/membros/' + id + '/secretario', {
      method: 'PUT', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(dados)
    });
    if (!r.ok) throw new Error('Erro ao atualizar');
    toast('Membro atualizado!');
    carregarMembros();
  } catch (e) {
    toast(e.message, 'error');
  }
}

// ===== CARREGAR DOCUMENTOS =====
async function carregarDocumentos() {
  const div = document.getElementById('listaDocumentos');
  div.innerHTML = 'A carregar...';
  
  try {
    const r = await fetch(API + '/documentos/igreja/' + igrejaAtual.igrejaId);
    const docs = await r.json();
    
    if (!docs.length) {
      div.innerHTML = '<p style="color:var(--muted)">Nenhum documento registado.</p>';
      return;
    }
    
    div.innerHTML = `
      <table>
        <thead><tr><th>Nome</th><th>Tipo</th><th>Membro</th><th>Data</th><th>Ações</th></tr></thead>
        <tbody>
          ${docs.map(d => `
            <tr>
              <td>${d.nome}</td>
              <td>${d.tipo}</td>
              <td>${d.membro ? d.membro.nome : '-'}</td>
              <td>${new Date(d.criadoEm).toLocaleDateString('pt-PT')}</td>
              <td>
                <a href="${d.url}" target="_blank" class="btn btn-outline">📄 Ver</a>
                <button class="btn btn-danger" onclick="apagarDocumento(${d.id})">🗑️</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (e) {
    div.innerHTML = '<p style="color:var(--red)">Erro ao carregar documentos.</p>';
  }
}

// ===== ABRIR MODAL DE DOCUMENTO (simplificado com prompts) =====
async function abrirModalDocumento() {
  const nome = prompt('Nome do documento:');
  if (!nome) return;
  
  const tipo = prompt('Tipo (ATA, CERTIDAO_BATISMO, OUTRO):', 'ATA');
  if (!tipo) return;
  
  const url = prompt('Link do documento (Cloudinary):');
  if (!url) return;
  
  const membroId = prompt('ID do membro (deixe em branco se for documento da igreja):');
  
  try {
    const r = await fetch(API + '/documentos', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        igrejaId: igrejaAtual.igrejaId,
        nome, tipo, url,
        membroId: membroId || null
      })
    });
    if (!r.ok) throw new Error('Erro ao criar documento');
    toast('Documento criado!');
    carregarDocumentos();
  } catch (e) {
    toast(e.message, 'error');
  }
}

// ===== APAGAR DOCUMENTO =====
async function apagarDocumento(id) {
  if (!confirm('Apagar este documento?')) return;
  try {
    await fetch(API + '/documentos/' + id, { method: 'DELETE' });
    toast('Documento apagado!');
    carregarDocumentos();
  } catch (e) {
    toast(e.message, 'error');
  }
}

// ===== CARREGAR PRESENÇAS =====
async function carregarPresencas() {
  const div = document.getElementById('listaPresencas');
  div.innerHTML = 'A carregar...';
  
  try {
    const r = await fetch(API + '/presencas/presenca/igreja/' + igrejaAtual.igrejaId);
    const presencas = await r.json();
    
    if (!presencas.length) {
      div.innerHTML = '<p style="color:var(--muted)">Nenhuma presença registada.</p>';
      return;
    }
    
    div.innerHTML = `
      <table>
        <thead><tr><th>Membro</th><th>Tipo</th><th>Data</th></tr></thead>
        <tbody>
          ${presencas.map(p => `
            <tr>
              <td>${p.membro ? p.membro.nome : '-'}</td>
              <td>${p.tipo}</td>
              <td>${new Date(p.data).toLocaleDateString('pt-PT')}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (e) {
    div.innerHTML = '<p style="color:var(--red)">Erro ao carregar presenças.</p>';
  }
}

// ===== ABRIR MODAL DE PRESENÇA (simplificado com prompts) =====
async function abrirModalPresenca() {
  const membroId = prompt('ID do membro:');
  if (!membroId) return;
  
  const tipo = prompt('Tipo (CULTO, REUNIAO, ENSAIO):', 'CULTO');
  if (!tipo) return;
  
  try {
    const r = await fetch(API + '/presencas/presenca', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        igrejaId: igrejaAtual.igrejaId,
        membroId, tipo
      })
    });
    if (!r.ok) throw new Error('Erro ao registar presença');
    toast('Presença registada!');
    carregarPresencas();
  } catch (e) {
    toast(e.message, 'error');
  }
}

initLogin();
</script>
</body>
</html>
